spring:
  application:
    name: dentalcare-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

dentalcare:
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:false}
    full-name: ${INITIAL_ADMIN_FULL_NAME:}
    cui: ${INITIAL_ADMIN_CUI:}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${FRONTEND_URL}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:30m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    refresh-inactivity-timeout: ${JWT_REFRESH_INACTIVITY_TIMEOUT:24h}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  openapi:
    public-access: false
  password-recovery:
    expiration: ${PASSWORD_RECOVERY_EXPIRATION:15m}
    max-attempts: ${PASSWORD_RECOVERY_MAX_ATTEMPTS:5}
    mail-from: ${PASSWORD_RECOVERY_MAIL_FROM:no-reply@dentalcare.local}
  google-drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:false}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    application-name: ${GOOGLE_DRIVE_APPLICATION_NAME:DentalCare API}
