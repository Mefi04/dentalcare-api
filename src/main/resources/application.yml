spring:
  application:
    name: dentalcare-api
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:12MB}
      file-size-threshold: 0B
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      max-lifetime: ${DB_MAX_LIFETIME:600000}
  transaction:
    default-timeout: ${DB_TX_TIMEOUT:15}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_SMTP_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: 10000
    max-threads: ${SERVER_MAX_THREADS:200}
    max-part-count: ${DOCUMENT_MAX_PART_COUNT:8}
    max-swallow-size: ${DOCUMENT_MAX_SWALLOW_SIZE:12MB}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

dentalcare:
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
      login:
        window: ${RATE_LIMIT_LOGIN_WINDOW:5m}
        ip-limit: ${RATE_LIMIT_LOGIN_IP:30}
        identity-limit: ${RATE_LIMIT_LOGIN_IDENTITY:10}
      password-recovery:
        window: ${RATE_LIMIT_RECOVERY_WINDOW:1h}
        ip-limit: ${RATE_LIMIT_RECOVERY_IP:15}
        identity-limit: ${RATE_LIMIT_RECOVERY_IDENTITY:5}
      public-contact:
        window: ${RATE_LIMIT_CONTACT_WINDOW:15m}
        ip-limit: ${RATE_LIMIT_CONTACT_IP:10}
        identity-limit: 0
      clinical-document-upload:
        window: ${RATE_LIMIT_DOCUMENT_UPLOAD_WINDOW:1m}
        ip-limit: ${RATE_LIMIT_DOCUMENT_UPLOAD_IP:40}
        identity-limit: ${RATE_LIMIT_DOCUMENT_UPLOAD_IDENTITY:20}
      clinical-document-download:
        window: ${RATE_LIMIT_DOCUMENT_DOWNLOAD_WINDOW:1m}
        ip-limit: ${RATE_LIMIT_DOCUMENT_DOWNLOAD_IP:240}
        identity-limit: ${RATE_LIMIT_DOCUMENT_DOWNLOAD_IDENTITY:120}
      public-appointment-request:
        window: ${RATE_LIMIT_PUBLIC_APPOINTMENT_WINDOW:15m}
        ip-limit: ${RATE_LIMIT_PUBLIC_APPOINTMENT_IP:5}
        identity-limit: ${RATE_LIMIT_PUBLIC_APPOINTMENT_IDENTITY:10}
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:false}
    full-name: ${INITIAL_ADMIN_FULL_NAME:}
    cui: ${INITIAL_ADMIN_CUI:}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${FRONTEND_URL}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:30m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    refresh-inactivity-timeout: ${JWT_REFRESH_INACTIVITY_TIMEOUT:24h}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  openapi:
    public-access: false
  password-recovery:
    expiration: ${PASSWORD_RECOVERY_EXPIRATION:15m}
    max-attempts: ${PASSWORD_RECOVERY_MAX_ATTEMPTS:5}
    mail-from: ${PASSWORD_RECOVERY_MAIL_FROM:no-reply@dentalcare.local}
  public-appointment-verification:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}
    email-enabled: ${PUBLIC_APPOINTMENT_EMAIL_ENABLED:false}
  appointment-outbox:
    encryption-key: ${APPOINTMENT_OUTBOX_ENCRYPTION_KEY:}
    max-attempts: ${APPOINTMENT_OUTBOX_MAX_ATTEMPTS:8}
    base-retry-delay: ${APPOINTMENT_OUTBOX_BASE_RETRY_DELAY:30s}
    processing-lease: ${APPOINTMENT_OUTBOX_PROCESSING_LEASE:2m}
    batch-size: ${APPOINTMENT_OUTBOX_BATCH_SIZE:10}
    poll-delay: ${APPOINTMENT_OUTBOX_POLL_DELAY:5s}
  r2:
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:}
    bucket: ${R2_BUCKET:dentalcare-expedientes}
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    api-call-timeout: ${R2_API_CALL_TIMEOUT:30s}
    api-call-attempt-timeout: ${R2_API_CALL_ATTEMPT_TIMEOUT:15s}
  clinical-documents:
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
    max-concurrent-uploads: ${DOCUMENT_MAX_CONCURRENT_UPLOADS:4}
    max-concurrent-downloads: ${DOCUMENT_MAX_CONCURRENT_DOWNLOADS:20}
