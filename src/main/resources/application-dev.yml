spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:2}
      minimum-idle: ${DB_MIN_IDLE:0}
      data-source-properties:
        prepareThreshold: ${DB_PREPARE_THRESHOLD:0}

dentalcare:
  openapi:
    public-access: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
