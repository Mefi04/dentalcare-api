name: PR Review Bot

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-review-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze pull request
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Analyze pull request diff
        id: analysis
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          git diff --numstat "${BASE_SHA}...${HEAD_SHA}" > diff-numstat.txt
          git diff --unified=0 "${BASE_SHA}...${HEAD_SHA}" > pr.diff

          FILE_COUNT=$(wc -l < changed-files.txt | tr -d ' ')
          ADDITIONS=$(awk '{ if ($1 ~ /^[0-9]+$/) a += $1 } END { print a + 0 }' diff-numstat.txt)
          DELETIONS=$(awk '{ if ($2 ~ /^[0-9]+$/) d += $2 } END { print d + 0 }' diff-numstat.txt)
          TOTAL_LINES=$((ADDITIONS + DELETIONS))

          SOURCE_CHANGED=false
          TESTS_CHANGED=false
          SECURITY_CHANGED=false
          LIQUIBASE_CHANGED=false
          CONTROLLER_CHANGED=false
          CONFIG_CHANGED=false
          WORKFLOW_CHANGED=false
          ENV_CHANGED=false

          grep -Eq '^src/main/java/.*\.java$' changed-files.txt && SOURCE_CHANGED=true || true
          grep -Eq '^src/test/' changed-files.txt && TESTS_CHANGED=true || true
          grep -Eiq '(^|/)(security|auth)(/|$)|Security|Jwt|Token|Password' changed-files.txt && SECURITY_CHANGED=true || true
          grep -Eiq 'db/changelog|liquibase' changed-files.txt && LIQUIBASE_CHANGED=true || true
          grep -Eiq '(^|/)controller/|Controller\.java$' changed-files.txt && CONTROLLER_CHANGED=true || true
          grep -Eiq '(^|/)(pom\.xml|Dockerfile|docker-compose[^/]*|application[^/]*\.(yml|yaml|properties))$' changed-files.txt && CONFIG_CHANGED=true || true
          grep -Eq '^\.github/workflows/' changed-files.txt && WORKFLOW_CHANGED=true || true
          grep -Eiq '(^|/)\.env($|\.)|\.env\.' changed-files.txt && ENV_CHANGED=true || true

          grep '^+' pr.diff | grep -v '^+++' > added-lines.txt || true
          ENDPOINTS_ADDED=$(grep -Ec '@(Get|Post|Put|Patch|Delete|Request)Mapping' added-lines.txt || true)
          TODO_ADDED=$(grep -Eic 'TODO|FIXME' added-lines.txt || true)

          SECRET_ALERT=false
          if grep -Eq -- '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' added-lines.txt; then
            SECRET_ALERT=true
          fi

          {
            echo "file_count=${FILE_COUNT}"
            echo "additions=${ADDITIONS}"
            echo "deletions=${DELETIONS}"
            echo "total_lines=${TOTAL_LINES}"
            echo "source_changed=${SOURCE_CHANGED}"
            echo "tests_changed=${TESTS_CHANGED}"
            echo "security_changed=${SECURITY_CHANGED}"
            echo "liquibase_changed=${LIQUIBASE_CHANGED}"
            echo "controller_changed=${CONTROLLER_CHANGED}"
            echo "config_changed=${CONFIG_CHANGED}"
            echo "workflow_changed=${WORKFLOW_CHANGED}"
            echo "env_changed=${ENV_CHANGED}"
            echo "endpoints_added=${ENDPOINTS_ADDED}"
            echo "todo_added=${TODO_ADDED}"
            echo "secret_alert=${SECRET_ALERT}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Maven tests
        id: maven
        continue-on-error: true
        run: mvn -B -ntp test

      - name: Build review report
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          MAVEN_OUTCOME: ${{ steps.maven.outcome }}
          FILE_COUNT: ${{ steps.analysis.outputs.file_count }}
          ADDITIONS: ${{ steps.analysis.outputs.additions }}
          DELETIONS: ${{ steps.analysis.outputs.deletions }}
          TOTAL_LINES: ${{ steps.analysis.outputs.total_lines }}
          SOURCE_CHANGED: ${{ steps.analysis.outputs.source_changed }}
          TESTS_CHANGED: ${{ steps.analysis.outputs.tests_changed }}
          SECURITY_CHANGED: ${{ steps.analysis.outputs.security_changed }}
          LIQUIBASE_CHANGED: ${{ steps.analysis.outputs.liquibase_changed }}
          CONTROLLER_CHANGED: ${{ steps.analysis.outputs.controller_changed }}
          CONFIG_CHANGED: ${{ steps.analysis.outputs.config_changed }}
          WORKFLOW_CHANGED: ${{ steps.analysis.outputs.workflow_changed }}
          ENV_CHANGED: ${{ steps.analysis.outputs.env_changed }}
          ENDPOINTS_ADDED: ${{ steps.analysis.outputs.endpoints_added }}
          TODO_ADDED: ${{ steps.analysis.outputs.todo_added }}
          SECRET_ALERT: ${{ steps.analysis.outputs.secret_alert }}
        run: |
          set -euo pipefail

          num() { [ -n "${1:-}" ] && printf '%s' "$1" || printf '0'; }
          bool() { [ "${1:-}" = 'true' ] && printf 'true' || printf 'false'; }

          FILE_COUNT=$(num "${FILE_COUNT:-}")
          ADDITIONS=$(num "${ADDITIONS:-}")
          DELETIONS=$(num "${DELETIONS:-}")
          TOTAL_LINES=$(num "${TOTAL_LINES:-}")
          ENDPOINTS_ADDED=$(num "${ENDPOINTS_ADDED:-}")
          TODO_ADDED=$(num "${TODO_ADDED:-}")
          SOURCE_CHANGED=$(bool "${SOURCE_CHANGED:-}")
          TESTS_CHANGED=$(bool "${TESTS_CHANGED:-}")
          SECURITY_CHANGED=$(bool "${SECURITY_CHANGED:-}")
          LIQUIBASE_CHANGED=$(bool "${LIQUIBASE_CHANGED:-}")
          CONTROLLER_CHANGED=$(bool "${CONTROLLER_CHANGED:-}")
          CONFIG_CHANGED=$(bool "${CONFIG_CHANGED:-}")
          WORKFLOW_CHANGED=$(bool "${WORKFLOW_CHANGED:-}")
          ENV_CHANGED=$(bool "${ENV_CHANGED:-}")
          SECRET_ALERT=$(bool "${SECRET_ALERT:-}")

          [ "${MAVEN_OUTCOME:-failure}" = 'success' ] && MAVEN_STATUS='✅ Correcto' || MAVEN_STATUS='❌ Falló'
          [ "${ANALYSIS_OUTCOME:-failure}" = 'success' ] && ANALYSIS_STATUS='✅ Correcto' || ANALYSIS_STATUS='❌ Falló'

          {
            echo '<!-- dentalcare-pr-review-bot -->'
            echo '## 🤖 DentalCare PR Review Bot'
            echo
            echo "Análisis automático del PR **#${PR_NUMBER}** de \`${HEAD_REF}\` hacia \`${BASE_REF}\`, creado por **@${PR_AUTHOR}**."
            echo
            echo '### Estado técnico'
            echo
            echo '| Validación | Estado |'
            echo '|---|---|'
            echo "| Análisis del diff | ${ANALYSIS_STATUS} |"
            echo "| Pruebas Maven | ${MAVEN_STATUS} |"
            echo
            echo '### Impacto detectado'
            echo
            echo "- **Archivos modificados:** ${FILE_COUNT}"
            echo "- **Líneas:** +${ADDITIONS} / -${DELETIONS}"
            echo "- **Endpoints detectados en líneas agregadas:** ${ENDPOINTS_ADDED}"
            echo "- **TODO/FIXME agregados:** ${TODO_ADDED}"
            echo
            echo '### Áreas afectadas'
            echo
            [ "${SOURCE_CHANGED}" = 'true' ] && echo '- 🧩 Código Java de producción' || true
            [ "${TESTS_CHANGED}" = 'true' ] && echo '- 🧪 Pruebas automatizadas' || true
            [ "${CONTROLLER_CHANGED}" = 'true' ] && echo '- 🌐 Controllers / endpoints' || true
            [ "${SECURITY_CHANGED}" = 'true' ] && echo '- 🔐 Autenticación / seguridad' || true
            [ "${LIQUIBASE_CHANGED}" = 'true' ] && echo '- 🗄️ Liquibase / base de datos' || true
            [ "${CONFIG_CHANGED}" = 'true' ] && echo '- ⚙️ Configuración / build / Docker' || true
            [ "${WORKFLOW_CHANGED}" = 'true' ] && echo '- 🔄 GitHub Actions' || true
            [ "${ENV_CHANGED}" = 'true' ] && echo '- 🚨 Archivo relacionado con `.env`' || true

            if [ "${SOURCE_CHANGED}" != 'true' ] && [ "${TESTS_CHANGED}" != 'true' ] && [ "${CONTROLLER_CHANGED}" != 'true' ] && [ "${SECURITY_CHANGED}" != 'true' ] && [ "${LIQUIBASE_CHANGED}" != 'true' ] && [ "${CONFIG_CHANGED}" != 'true' ] && [ "${WORKFLOW_CHANGED}" != 'true' ] && [ "${ENV_CHANGED}" != 'true' ]; then
              echo '- ℹ️ Sin categorías sensibles detectadas'
            fi

            echo
            echo '### Observaciones del bot'
            echo
            ALERTS=0

            if [ "${SOURCE_CHANGED}" = 'true' ] && [ "${TESTS_CHANGED}" != 'true' ]; then
              echo '- ⚠️ Se modificó código de producción sin cambios detectados en `src/test/`. Confirmar que la cobertura existente protege el cambio.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${SECURITY_CHANGED}" = 'true' ]; then
              echo '- ⚠️ Hay cambios relacionados con autenticación o seguridad. Revisar autorización por rol, tokens y exposición de datos sensibles.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${CONTROLLER_CHANGED}" = 'true' ] || [ "${ENDPOINTS_ADDED}" -gt 0 ]; then
              echo '- ⚠️ Hay cambios de endpoints. Revisar validaciones, códigos HTTP, permisos y compatibilidad con los clientes actuales.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${LIQUIBASE_CHANGED}" = 'true' ]; then
              echo '- ⚠️ Hay cambios de Liquibase/BD. Revisar migraciones, restricciones, índices y rollback.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${CONFIG_CHANGED}" = 'true' ]; then
              echo '- ⚠️ Se tocó configuración, dependencias o Docker. Confirmar despliegue y perfiles de ejecución.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${WORKFLOW_CHANGED}" = 'true' ]; then
              echo '- ⚠️ El PR modifica GitHub Actions. Requiere revisión manual adicional antes del merge.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${ENV_CHANGED}" = 'true' ]; then
              echo '- 🚨 Se detectó un archivo relacionado con `.env`. Confirmar que no se versionen credenciales.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${SECRET_ALERT}" = 'true' ]; then
              echo '- 🚨 **Posible secreto de alta confianza detectado.** El bot no muestra el valor. Revisar el diff y rotar la credencial si fuera real.'
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${TODO_ADDED}" -gt 0 ]; then
              echo "- ⚠️ Se agregaron ${TODO_ADDED} TODO/FIXME; confirmar que no representen trabajo obligatorio pendiente."
              ALERTS=$((ALERTS + 1))
            fi
            if [ "${TOTAL_LINES}" -gt 1000 ]; then
              echo '- ⚠️ El cambio supera 1000 líneas; revisar cuidadosamente el alcance y su trazabilidad con el ticket.'
              ALERTS=$((ALERTS + 1))
            fi
            [ "${ALERTS}" -eq 0 ] && echo '- ✅ No se detectaron alertas estructurales adicionales.' || true

            echo
            echo '### Archivos modificados'
            echo
            if [ -s changed-files.txt ]; then
              sed -n '1,25p' changed-files.txt | sed 's/^/- `/' | sed 's/$/`/'
              [ "${FILE_COUNT}" -gt 25 ] && echo "- … y $((FILE_COUNT - 25)) archivo(s) más." || true
            else
              echo '- No fue posible obtener la lista de archivos.'
            fi

            echo
            if [ "${MAVEN_OUTCOME:-failure}" = 'success' ] && [ "${ANALYSIS_OUTCOME:-failure}" = 'success' ] && [ "${SECRET_ALERT}" != 'true' ]; then
              echo '### ✅ Resultado del bot: validaciones automáticas superadas'
            else
              echo '### ❌ Resultado del bot: requiere corrección antes del merge'
            fi
            echo
            echo '> Este análisis complementa, pero no sustituye, la revisión humana del PR ni el workflow `Backend CI`.'
          } > pr-review-report.md

      - name: Add report to job summary
        if: always()
        shell: bash
        run: test ! -f pr-review-report.md || cat pr-review-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-report-${{ github.event.pull_request.number }}
          path: pr-review-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce bot result
        if: always()
        shell: bash
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          MAVEN_OUTCOME: ${{ steps.maven.outcome }}
          SECRET_ALERT: ${{ steps.analysis.outputs.secret_alert }}
        run: |
          set -euo pipefail
          [ "${ANALYSIS_OUTCOME:-failure}" = 'success' ] || { echo 'Static PR analysis failed.'; exit 1; }
          [ "${MAVEN_OUTCOME:-failure}" = 'success' ] || { echo 'Maven tests failed.'; exit 1; }
          [ "${SECRET_ALERT:-false}" != 'true' ] || { echo 'Possible high-confidence secret detected.'; exit 1; }
          echo 'PR Review Bot checks passed.'

  comment:
    name: Publish review
    needs: analyze
    if: ${{ always() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Download review report
        uses: actions/download-artifact@v4
        with:
          name: pr-review-report-${{ github.event.pull_request.number }}

      - name: Publish or update bot comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -s pr-review-report.md

          COMMENT_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- dentalcare-pr-review-bot -->")) | .id' | head -n 1 || true)

          jq -Rs '{body: .}' pr-review-report.md > pr-review-comment.json

          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input pr-review-comment.json >/dev/null
            echo "Updated bot comment ${COMMENT_ID}."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input pr-review-comment.json >/dev/null
            echo 'Created bot comment.'
          fi
