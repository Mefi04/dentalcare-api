global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/backup-alerts.yml
scrape_configs:
  - job_name: dentalcare
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9091']
  - job_name: dentalcare-backup
    static_configs:
      - targets: ['backup-status:8000']
