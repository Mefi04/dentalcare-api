groups:
  - name: dentalcare-backup
    rules:
      - alert: BackupMissing
        expr: max(dentalcare_backup_last_complete_timestamp_seconds) == 0 or absent(dentalcare_backup_last_complete_timestamp_seconds)
        for: 5m
        labels: {severity: critical}
      - alert: BackupExecutionFailed
        expr: (max(dentalcare_backup_last_result) == 0 and max(dentalcare_backup_last_attempt_timestamp_seconds) > 0) or (time() - max(dentalcare_backup_last_failure_timestamp_seconds) >= 0 and time() - max(dentalcare_backup_last_failure_timestamp_seconds) < 300 and max(dentalcare_backup_last_failure_timestamp_seconds) > 0)
        labels: {severity: critical}
      - alert: BackupPayloadUnavailable
        expr: max(dentalcare_backup_payload_available) == 0 or absent(dentalcare_backup_payload_available)
        for: 1m
        labels: {severity: critical}
      - alert: BackupStale
        expr: time() - max(dentalcare_backup_last_complete_timestamp_seconds) > 93600 and time() - max(dentalcare_backup_last_complete_timestamp_seconds) <= 172800 and max(dentalcare_backup_last_complete_timestamp_seconds) > 0
        labels: {severity: warning}
      - alert: BackupVeryStale
        expr: time() - max(dentalcare_backup_last_complete_timestamp_seconds) > 172800 and max(dentalcare_backup_last_complete_timestamp_seconds) > 0
        labels: {severity: critical}
      - alert: BackupRestoreOverdue
        expr: max(dentalcare_backup_last_restore_timestamp_seconds) == 0 or time() - max(dentalcare_backup_last_restore_timestamp_seconds) > 2592000 or absent(dentalcare_backup_last_restore_timestamp_seconds)
        for: 5m
        labels: {severity: warning}
      - alert: BackupMonitoringUnavailable
        expr: max(up{job="dentalcare-backup"}) == 0 or sum(absent(up{job="dentalcare-backup"}))
        for: 1m
        labels: {severity: critical}
