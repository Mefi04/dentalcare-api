services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-30m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      INITIAL_ADMIN_ENABLED: ${INITIAL_ADMIN_ENABLED:-false}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME:-}
      INITIAL_ADMIN_CUI: ${INITIAL_ADMIN_CUI:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-dentalcare-expedientes}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_API_CALL_TIMEOUT: ${R2_API_CALL_TIMEOUT:-30s}
      R2_API_CALL_ATTEMPT_TIMEOUT: ${R2_API_CALL_ATTEMPT_TIMEOUT:-15s}
      DOCUMENT_MAX_FILE_SIZE: ${DOCUMENT_MAX_FILE_SIZE:-10MB}
      DOCUMENT_MAX_REQUEST_SIZE: ${DOCUMENT_MAX_REQUEST_SIZE:-12MB}
      DOCUMENT_MAX_PART_COUNT: ${DOCUMENT_MAX_PART_COUNT:-8}
      DOCUMENT_MAX_SWALLOW_SIZE: ${DOCUMENT_MAX_SWALLOW_SIZE:-12MB}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-5m}
      RATE_LIMIT_LOGIN_IP: ${RATE_LIMIT_LOGIN_IP:-30}
      RATE_LIMIT_LOGIN_IDENTITY: ${RATE_LIMIT_LOGIN_IDENTITY:-10}
      RATE_LIMIT_RECOVERY_WINDOW: ${RATE_LIMIT_RECOVERY_WINDOW:-1h}
      RATE_LIMIT_RECOVERY_IP: ${RATE_LIMIT_RECOVERY_IP:-15}
      RATE_LIMIT_RECOVERY_IDENTITY: ${RATE_LIMIT_RECOVERY_IDENTITY:-5}
      RATE_LIMIT_CONTACT_WINDOW: ${RATE_LIMIT_CONTACT_WINDOW:-15m}
      RATE_LIMIT_CONTACT_IP: ${RATE_LIMIT_CONTACT_IP:-10}
      RATE_LIMIT_DOCUMENT_UPLOAD_WINDOW: ${RATE_LIMIT_DOCUMENT_UPLOAD_WINDOW:-1m}
      RATE_LIMIT_DOCUMENT_UPLOAD_IP: ${RATE_LIMIT_DOCUMENT_UPLOAD_IP:-40}
      RATE_LIMIT_DOCUMENT_UPLOAD_IDENTITY: ${RATE_LIMIT_DOCUMENT_UPLOAD_IDENTITY:-20}
      RATE_LIMIT_DOCUMENT_DOWNLOAD_WINDOW: ${RATE_LIMIT_DOCUMENT_DOWNLOAD_WINDOW:-1m}
      RATE_LIMIT_DOCUMENT_DOWNLOAD_IP: ${RATE_LIMIT_DOCUMENT_DOWNLOAD_IP:-240}
      RATE_LIMIT_DOCUMENT_DOWNLOAD_IDENTITY: ${RATE_LIMIT_DOCUMENT_DOWNLOAD_IDENTITY:-120}
      DOCUMENT_MAX_CONCURRENT_UPLOADS: ${DOCUMENT_MAX_CONCURRENT_UPLOADS:-4}
      DOCUMENT_MAX_CONCURRENT_DOWNLOADS: ${DOCUMENT_MAX_CONCURRENT_DOWNLOADS:-20}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-monitor}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    entrypoint: ["/bin/sh", "-ec", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'GRAFANA_ADMIN_PASSWORD is required'; exit 1; }; exec /run.sh"]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  prometheus-data:
  grafana-data:
